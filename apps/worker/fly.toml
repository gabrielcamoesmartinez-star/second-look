# Fly.io config for the worker. Deploy from the repo root:
#   fly deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile
# Secrets: fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... PAGESPEED_API_KEY=... PUBLIC_SITE_URL=...
app = "second-look-worker"
primary_region = "mad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[processes]
  worker = "node --import tsx src/main.ts"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
  processes = ["worker"]
