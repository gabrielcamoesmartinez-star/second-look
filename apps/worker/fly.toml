# Fly.io config for the audit worker. Create the app with: fly launch --no-deploy --copy-config
# then set secrets: fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... PAGESPEED_API_KEY=...
app = "second-look-worker"
primary_region = "mad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKER_CONCURRENCY = "2"
  POLL_INTERVAL_MS = "2000"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[processes]
  worker = "node dist/index.js"
